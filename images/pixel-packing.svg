<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640"><rect x="0" y="0" width="640" height="250" rx="10" fill="#141518"/><text x="20" y="30" font-size="15" fill="#e8e8ea" font-weight="700" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">One SysEx data byte = 3 pixels, 2 bits each (example 0x33)</text><rect x="20" y="48" width="56" height="44" rx="6" fill="#5c626b" opacity="0.25" stroke="#5c626b"/><text x="48" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">0</text><text x="48" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 6</text><rect x="82" y="48" width="56" height="44" rx="6" fill="#e5322d" opacity="0.25" stroke="#e5322d"/><text x="110" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">1</text><text x="110" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 5</text><rect x="144" y="48" width="56" height="44" rx="6" fill="#e5322d" opacity="0.25" stroke="#e5322d"/><text x="172" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">1</text><text x="172" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 4</text><rect x="206" y="48" width="56" height="44" rx="6" fill="#e3a008" opacity="0.25" stroke="#e3a008"/><text x="234" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">0</text><text x="234" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 3</text><rect x="268" y="48" width="56" height="44" rx="6" fill="#e3a008" opacity="0.25" stroke="#e3a008"/><text x="296" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">0</text><text x="296" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 2</text><rect x="330" y="48" width="56" height="44" rx="6" fill="#3fb950" opacity="0.25" stroke="#3fb950"/><text x="358" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">1</text><text x="358" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 1</text><rect x="392" y="48" width="56" height="44" rx="6" fill="#3fb950" opacity="0.25" stroke="#3fb950"/><text x="420" y="78" font-size="20" fill="#e8e8ea" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">1</text><text x="420" y="108" font-size="11" fill="#9aa0a8" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">bit 0</text><text x="138" y="128" font-size="12" fill="#e5322d" text-anchor="middle" font-weight="700" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">pixel 0 = 3</text><text x="262" y="128" font-size="12" fill="#e3a008" text-anchor="middle" font-weight="700" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">pixel 1 = 0</text><text x="386" y="128" font-size="12" fill="#3fb950" text-anchor="middle" font-weight="700" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">pixel 2 = 3</text><text x="470" y="62" font-size="13" fill="#b8bec7" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">on the screen:</text><rect x="470" y="74" width="40" height="40" fill="#dde8ff" stroke="#0b1a5c"/><rect x="520" y="74" width="40" height="40" fill="#1f3fbf" stroke="#0b1a5c"/><rect x="570" y="74" width="40" height="40" fill="#dde8ff" stroke="#0b1a5c"/><text x="20" y="165" font-size="13" fill="#b8bec7" style="font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">byte = (p0 &lt;&lt; 4) | (p1 &lt;&lt; 2) | p2. Stock firmware: a pixel is lit when its value ≥ 2 (use 3 for on, 0 for off).</text><rect x="20" y="185" width="68" height="48" rx="6" fill="#1b1e22" stroke="#2a2e34"/><text x="54" y="205" font-size="15" fill="#ffd34d" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">00</text><text x="54" y="224" font-size="13" fill="#e8e8ea" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">_ _ _</text><rect x="96" y="185" width="68" height="48" rx="6" fill="#1b1e22" stroke="#2a2e34"/><text x="130" y="205" font-size="15" fill="#ffd34d" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">30</text><text x="130" y="224" font-size="13" fill="#e8e8ea" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">X _ _</text><rect x="172" y="185" width="68" height="48" rx="6" fill="#1b1e22" stroke="#2a2e34"/><text x="206" y="205" font-size="15" fill="#ffd34d" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">0C</text><text x="206" y="224" font-size="13" fill="#e8e8ea" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">_ X _</text><rect x="248" y="185" width="68" height="48" rx="6" fill="#1b1e22" stroke="#2a2e34"/><text x="282" y="205" font-size="15" fill="#ffd34d" text-anchor="middle" font-weight="700" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">03</text><text x="282" y="224" font-size="13" fill="#e8e8ea" text-anchor="middle" style="font-family:SFMono-Regular,Menlo,Consolas,monospace">_ _ X</text><rect x="324" y="185" width="68" height="48" rx="6" fill="#1b1e22" stroke="#2a2e34"/><text x="358" y="205" font-size="15" fill="#